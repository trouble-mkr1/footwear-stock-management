<!DOCTYPE html>
<html lang = "en">

    <head>

        <link rel = "stylesheet" href = "/css/style.css">
    </head>

    <body>

        <header class = "topbar">
            <h1>FOOTWEAR STOCK MANAGEMENT</h1>
        </header>

        <div class = "app-container">

            <aside class = "sidebar">

                <button class = "nav-button active">
                    DASHBOARD
                </button>

                <button class = "nav-button">
                    PRODUCT
                </button>

                <button class = "nav-button">

                <button class = "nav-button">
