<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <title>Footwear Stock Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="topbar">
        <h1>FOOTWEAR STOCK MANAGEMENT</h1>
    </header>

    <div class="app-container">

        <aside class="sidebar">

            <button class="nav-button active">
                DASHBOARD
            </button>

            <button class="nav-button">
                PRODUCT
            </button>

            <button class="nav-button">
                STOCK
            </button>

            <button class="nav-button">
                ORDERS
            </button>

            <button class="nav-button">
                BILLING
            </button>

        </aside>


        <main class="main-content">
            <div class="page-header">
                <h2>Product/Stock Management</h2>
                <button id="add-stock-button">
                    +ADD STOCK
                </button>
            </div>
            <div class="search-container">
                <input type="text" id="product-search" placeholder="Search by Art Number.....">
            </div>
            <!-- PRODUCT CATALOGUE -->
            <div id="products-container" class="products-grid">
                Loading products...
            </div>

            <!--product details-->
            <div id="product-details" class="product-details hidden">

                <button id="back-button">
                    Back to Products
                </button>

                <h2 id="details-art-number"></h2>

                <p id="details-price"></p>

                <img id="details-image" class="details-image" alt="Product image">

                <h3>Colour</h3>

                <div id="colour-buttons"></div>
                <h3>Available Stock</h3>
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>Size</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body"></tbody>
                </table>
            </div>

            <!--Adding Stock-->
            <div id="add-stock-form" class="hidden">
                <h2>Add Stock</h2>
                <form id="stock-form">
                    <label for="stock-art-number">Art Number</label>
                    <input 
                    type="text"
                    id="stock-art-number"
                    placeholder="Enter Art Number"
                    autocomplete="off"
                    >
                    <div id="art-suggestions" class="suggestions hidden"></div>

                    <label for="stock-colour">Colour</label>
                    <select id="stock-colour" required>
                        <option value="">Select Colour </option>

                    </select>

                    <label for="stock-size">Size</label>

                    <input type="number" id="stock-size" min="1" required>
                    

                    <label for="stock-quantity">Quantity</label>
                    <input type="number" id="stock-quantity" min="1" required>
                   
                    <button type="submit">
                        Add Stock
                    </button>
                </form>
            </div>
        </main>

    </div>

    <script src="/js/script.js"></script>

</body>

</html>
