<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale = 1.0">
    <title>Footwear Stock Management</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="topbar">
        <h1>FOOTWEAR STOCK MANAGEMENT</h1>
    </header>

    <div class="app-container">

        <aside class="sidebar">

            <button class="nav-button active">
                DASHBOARD
            </button>

            <button class="nav-button">
                PRODUCT
            </button>

            <button class="nav-button">
                STOCK
            </button>

            <button class="nav-button" id="orders-button">
                ORDERS
            </button>

            <button class="nav-button">
                BILLING
            </button>

        </aside>


        <main class="main-content">
            <div class="page-header">
                <h2>Product/Stock Management</h2>
                <button id="add-stock-button">
                    +ADD STOCK
                </button>
            </div>
            <div class="search-container">
                <input type="text" id="product-search" placeholder="Search by Art Number.....">
            </div>
            <!-- PRODUCT CATALOGUE -->
            <div id="products-container" class="products-grid">
                Loading products...
            </div>

            <!--product details-->
            <div id="product-details" class="product-details hidden">

                <button id="back-button">
                    Back to Products
                </button>

                <h2 id="details-art-number"></h2>

                <p id="details-price"></p>

                <img id="details-image" class="details-image" alt="Product image">

                <h3>Colour</h3>

                <div id="colour-buttons"></div>
                <h3>Available Stock</h3>
                <table class="stock-table">
                    <thead>
                        <tr>
                            <th>Size</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body"></tbody>
                </table>
            </div>

            <!--Adding Stock-->
            <div id="add-stock-form" class="hidden">
                <h2>Add Stock</h2>
                <form id="stock-form">
                    <label for="stock-art-number">Art Number</label>
                    <input 
                    type="text"
                    id="stock-art-number"
                    placeholder="Enter Art Number"
                    autocomplete="off"
                    required
                    >
                    
                    <label for="stock-colour">Colour</label>
                        <input
                            type="text"
                            id="stock-colour"
                            placeholder="Enter Colour"
                            required
                        >
                    

                    <label for="stock-size">Size</label>

                    <input 
                        type="number" 
                        id="stock-size" 
                        min="1" 
                        placeholder="Enter Size"
                        required>
                    

                    <label for="stock-quantity">Quantity</label>
                    <input 
                        type="number" 
                        id="stock-quantity" 
                        min="1" 
                        placeholder="Enter Quantity"
                        required>
                   
                    <button type="submit">Add Stock</button>
                    <button type="button" id="add-new-product-button">+Add New Product</button>
                </form>
            </div>
            
            
            <!--New Product Catalouge-->
            <div id="add-new-product-form" class="hidden">
                <h2>ADD NEW PRODUCT</h2>
                <form id="new-product-form">
                    <label for="new-art-number">Art Number</label>
                    <input
                        type="text"
                        id="new-art-number"
                        placeholder="Enter Art Number"
                        required
                    >
                    <label for="new-colour">Colour</label>
                    <input
                        type="text"
                        id="new-colour"
                        placeholder="Enter Colour"
                        required
                    >
                    <label for="new-price">Price</label>
                    <input
                        type="number"
                        id="new-price"
                        min="1"
                        placeholder="Enter Price"
                        required
                    >
                    <label for="new-size">Size</label>
                    <input
                        type="number"
                        id="new-size"
                        min="1"
                        placeholder="Enter Size"
                        required
                    >
                    <label for="new-quantity">Quantity</label>
                    <input
                        type="number"
                        id="new-quantity"
                        placeholder="Enter No.of Quantity"
                        required
                    >
                    <label for="new-image">Product Image</label>
                    <input
                        type="file"
                        id="new-image"
                        accept="image/*"
                        required
                    >
                    <img
                        id="image-preview"
                        class="image-preview"
                        alt="Selected product image"
                    >
                    <button type="submit">Add Product</button>
                    <button type="button" id="cancel-new-product">Cancel</button>
                </form>

            </div>

            <!--ORDER-PAGE LAYOUt-->
            <div id="orders-page" class="hidden">
                <div class="page-header">
                    <h2>ORDERS</h2>
                    <button id="add-orders-button">+Add Order</button>
                </div>
                <div id="search-container">
                    <input
                        type="text"
                        id="order-search"
                        placeholder="Search by Company Name..."
                    >
                </div>
                <div id="orders-container">Loading Orders</div>
            </div>
        </main>

    </div>

    <script src="/js/script.js"></script>

</body>

</html>
